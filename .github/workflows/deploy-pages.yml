name: Deploy web app to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/**
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Export static web build
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_GH_PAGES: '1'

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site via the API on the repo's behalf if it isn't
          # already turned on, instead of requiring the Settings -> Pages UI
          # toggle to have already been set to "GitHub Actions" beforehand.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
